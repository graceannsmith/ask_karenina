 <svg
  class="title-svg"
  viewBox="-50 0 700 300"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <path
      id="titleArc"
      d="M-50,200 Q300,40 650,200"
    />
  </defs>

  <text
    font-size="100"
    font-family="Federo"
    fill="#59483f"
  >
    <textPath
      href="#titleArc"
      startOffset="50%"
      text-anchor="middle"
    >
      ASK KARENINA
    </textPath>
  </text>
  <g id="architectural-framework" fill="none">

  <!-- LEFT: light moves toward center -->
  <path d="M160,225 V285"
        stroke="#59483f" stroke-width="1.5" opacity="0.8" />

  <path d="M164,238 V285"
        stroke="#a88459" stroke-width="1.2" opacity="0.75" />

  <path d="M168,251 V285"
        stroke="#d1ad78" stroke-width="1.1" opacity="0.7" />


  <!-- CENTER: taller, with light on both sides -->
  <path d="M300,155 V285"
        stroke="#59483f" stroke-width="1.5" opacity="0.8" />

  <path d="M296,174 V285"
        stroke="#a88459" stroke-width="1.2" opacity="0.75" />

  <path d="M304,174 V285"
        stroke="#d1ad78" stroke-width="1.1" opacity="0.7" />


  <!-- RIGHT: mirrored toward center -->
  <path d="M440,225 V285"
        stroke="#59483f" stroke-width="1.5" opacity="0.8" />

  <path d="M436,238 V285"
        stroke="#a88459" stroke-width="1.2" opacity="0.75" />

  <path d="M432,251 V285"
        stroke="#d1ad78" stroke-width="1.1" opacity="0.7" />
<!-- HORIZON / ARCHITECTURAL FOUNDATION -->

<g id="horizon-lines" fill="none">

  <!-- Main horizon -->
  <path
    d="M115,288 H485"
    stroke="#59483f"
    stroke-width="1.2"
    opacity="0.55"
  />

  <!-- Warm golden echo -->
  <path
    d="M145,292 H455"
    stroke="#a88459"
    stroke-width="1"
    opacity="0.65"
  />

  <!-- Faint inner reflection -->
  <path
    d="M195,296 H405"
    stroke="#d1ad78"
    stroke-width="0.8"
    opacity="0.65"
  />

</g>
<!-- CIRCULAR LIGHT ACCENTS -->

<g fill="none">

  <!-- LEFT OF CENTRAL LINE -->
  <circle cx="282" cy="279" r="7"
          stroke="#59483f" stroke-width="1.3" opacity="0.65"/>
  <circle cx="282" cy="265" r="4.5"

  <circle cx="282" cy="254" r="2.5"

</g>
