
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anna Karenina Quotes</title>
</head>

<body class="everything">

  <div class="page-wrapper">

    <!-- ========================================
         ART DECO CORNER ORNAMENTS
    ========================================= -->

    <!-- Upper-left corner -->

    <svg
      class="corner-ornament top-left"
      viewBox="0 0 100 100"
      aria-hidden="true"
    >
      <g fill="none" stroke-linecap="round">

        <path d="M10,85 V10 H85"
              stroke="#59483f" stroke-width="1.5" />

        <path d="M17,70 V17 H70"
              stroke="#a88459" stroke-width="1" />

        <circle cx="17" cy="17" r="7"
                stroke="#59483f" stroke-width="1.5" />

        <circle cx="17" cy="17" r="11"
                stroke="#a88459" stroke-width="1"
                opacity="0.7" />

        <circle cx="17" cy="17" r="15"
                stroke="#d1ad78" stroke-width="0.8"
                opacity="0.5" />

      </g>
    </svg>

    <!-- Upper-right corner -->

    <svg
      class="corner-ornament top-right"
      viewBox="0 0 100 100"
      aria-hidden="true"
    >
      <g fill="none" stroke-linecap="round">

        <path d="M10,85 V10 H85"
              stroke="#59483f" stroke-width="1.5" />

        <path d="M17,70 V17 H70"
              stroke="#a88459" stroke-width="1" />

        <circle cx="17" cy="17" r="7"
                stroke="#59483f" stroke-width="1.5" />

        <circle cx="17" cy="17" r="11"
                stroke="#a88459" stroke-width="1"
                opacity="0.7" />

        <circle cx="17" cy="17" r="15"
                stroke="#d1ad78" stroke-width="0.8"
                opacity="0.5" />

      </g>
    </svg>

    <!-- Lower-right corner -->

    <svg
      class="corner-ornament bottom-right"
      viewBox="0 0 100 100"
      aria-hidden="true"
    >
      <g fill="none" stroke-linecap="round">

        <path d="M10,85 V10 H85"
              stroke="#59483f" stroke-width="1.5" />

        <path d="M17,70 V17 H70"
              stroke="#a88459" stroke-width="1" />

        <circle cx="17" cy="17" r="7"
                stroke="#59483f" stroke-width="1.5" />

        <circle cx="17" cy="17" r="11"
                stroke="#a88459" stroke-width="1"
                opacity="0.7" />

        <circle cx="17" cy="17" r="15"
                stroke="#d1ad78" stroke-width="0.8"
                opacity="0.5" />

      </g>
    </svg>

    <!-- Lower-left corner -->

    <svg
      class="corner-ornament bottom-left"
      viewBox="0 0 100 100"
      aria-hidden="true"
    >
      <g fill="none" stroke-linecap="round">

        <path d="M10,85 V10 H85"
              stroke="#59483f" stroke-width="1.5" />

        <path d="M17,70 V17 H70"
              stroke="#a88459" stroke-width="1" />

        <circle cx="17" cy="17" r="7"
                stroke="#59483f" stroke-width="1.5" />

        <circle cx="17" cy="17" r="11"
                stroke="#a88459" stroke-width="1"
                opacity="0.7" />

        <circle cx="17" cy="17" r="15"
                stroke="#d1ad78" stroke-width="0.8"
                opacity="0.5" />

      </g>
    </svg>

    <!-- ========================================
         ARCHED SVG TITLE
    ========================================= -->

    <svg
      class="title-svg"
      viewBox="-50 0 700 300"
      xmlns="http://www.w3.org/2000/svg"
      role="img"
      aria-labelledby="svg-title"
    >

      <title id="svg-title">Ask Karenina</title>

      <defs>
        <path
          id="titleArc"
          d="M-50,200 Q300,40 650,200"
        />
      </defs>

      <text
        font-size="100"
        font-family="Federo"
        fill="#59483f"
      >
        <textPath
          href="#titleArc"
          startOffset="50%"
          text-anchor="middle"
        >
          ASK KARENINA
        </textPath>
      </text>

      <!-- Architectural framework -->

      <g id="architectural-framework" fill="none">

        <!-- Left: light moves toward center -->

        <path d="M160,225 V285"
              stroke="#59483f" stroke-width="1.5"
              opacity="0.8" />

        <path d="M164,238 V285"
              stroke="#a88459" stroke-width="1.2"
              opacity="0.75" />

        <path d="M168,251 V285"
              stroke="#d1ad78" stroke-width="1.1"
              opacity="0.7" />

        <!-- Center: taller, with light on both sides -->

        <path d="M300,155 V285"
              stroke="#59483f" stroke-width="1.5"
              opacity="0.8" />

        <path d="M296,174 V285"
              stroke="#a88459" stroke-width="1.2"
              opacity="0.75" />

        <path d="M304,174 V285"
              stroke="#d1ad78" stroke-width="1.1"
              opacity="0.7" />

        <!-- Right: mirrored toward center -->

        <path d="M440,225 V285"
              stroke="#59483f" stroke-width="1.5"
              opacity="0.8" />

        <path d="M436,238 V285"
              stroke="#a88459" stroke-width="1.2"
              opacity="0.75" />

        <path d="M432,251 V285"
              stroke="#d1ad78" stroke-width="1.1"
              opacity="0.7" />

        <!-- Horizon / architectural foundation -->

        <g id="horizon-lines" fill="none">

          <path d="M115,288 H485"
                stroke="#59483f" stroke-width="1.2"
                opacity="0.55" />

          <path d="M145,292 H455"
                stroke="#a88459" stroke-width="1"
                opacity="0.65" />

          <path d="M195,296 H405"
                stroke="#d1ad78" stroke-width="0.8"
                opacity="0.65" />

        </g>

        <!-- Circular light accents -->

        <g fill="none">

          <!-- Left of central line -->

          <circle cx="282" cy="279" r="7"
                  stroke="#59483f" stroke-width="1.3"
                  opacity="0.65" />

          <circle cx="282" cy="265" r="4.5"
                  stroke="#a88459" stroke-width="1"
                  opacity="0.65" />

          <circle cx="282" cy="254" r="2.5"
                  stroke="#d1ad78" stroke-width="0.8"
                  opacity="0.65" />

          <!-- Right of central line -->

          <circle cx="318" cy="279" r="7"
                  stroke="#59483f" stroke-width="1.3"
                  opacity="0.65" />

          <circle cx="318" cy="265" r="4.5"
                  stroke="#a88459" stroke-width="1"
                  opacity="0.65" />

          <circle cx="318" cy="254" r="2.5"
                  stroke="#d1ad78" stroke-width="0.8"
                  opacity="0.65" />

        </g>

      </g>

    </svg>

    <!-- ========================================
         QUOTATION SECTION
    ========================================= -->

    <main class="quote-section">

      <!-- Generate a new quotation -->

      <input
        class="button ask-anna-button"
        type="submit"
        value="ASK ANNA"
      />

      <!-- Passage display and navigation -->

      <div class="passage-layout">

        <button
          type="button"
          class="button passage-button"
          id="decrementButton"
        >
          Earlier Passage
        </button>

        <div id="quote-display"></div>

        <button
          type="button"
          class="button passage-button"
          id="incrementButton"
        >
          Later Passage
        </button>

      </div>

      <!-- Screen reader announcements -->

      <div
        id="quote-announcement"
        class="visually-hidden"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></div>

    </main>

  </div>

</body>

</html>
